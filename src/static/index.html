<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="main-header">
      <div class="header-content">
        <img class="school-avatar" src="https://cdn-icons-png.flaticon.com/512/3135/3135768.png" alt="School Logo">
        <div>
          <h1>Mergington High School</h1>
          <h2>Extracurricular Activities</h2>
        </div>
      </div>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list" class="activities-grid">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <!-- Modal para inscripción -->
      <div id="signup-modal" class="modal hidden">
        <div class="modal-content">
          <span class="close-modal" id="close-modal">&times;</span>
          <h3 id="modal-activity-title">Sign Up for Activity</h3>
          <form id="signup-form">
            <div class="form-group">
              <label for="email">Student Email:</label>
              <input type="email" id="email" required placeholder="your-email@mergington.edu" />
            </div>
            <input type="hidden" id="modal-activity" />
            <button type="submit">Sign Up</button>
          </form>
          <div id="message" class="hidden"></div>
        </div>
      </div>
    </main>

    <footer>
      <hr style="border:1px solid #393e4f; margin-bottom:16px;">
      <p>&copy; 2023 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
